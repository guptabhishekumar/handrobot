[project]
name = "handrobot"
version = "0.1.0"
description = "Teach a simulated robot arm to manipulate objects using only a webcam and your bare hands."
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.2",
  "mink>=0.0.10",
  "mediapipe==0.10.35",
  "opencv-python>=4.10",
  "numpy>=1.26,<2.3",
  "torch>=2.5",
  "torchvision>=0.20",
  "einops>=0.8",
  "imageio[ffmpeg]>=2.35",
  "tqdm>=4.66",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handrobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
