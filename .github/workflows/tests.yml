name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system OpenGL for headless MuJoCo rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libosmesa6
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Fetch tracker model
        run: ./scripts/fetch_models.sh
      - name: Restore measured tables
        uses: actions/cache@v4
        with:
          path: |
            assets/reach_table.npz
            assets/cache
          key: measured-tables-${{ hashFiles('src/handrobot/retarget/reach.py', 'src/handrobot/gripper.py', 'assets/so101/**', 'assets/panda/**') }}
      - name: Test
        run: .venv/bin/pytest -q
