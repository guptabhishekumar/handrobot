name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The runner renders MuJoCo in software, an order of magnitude slower than
    # the machine this is developed on: the suite takes roughly three quarters
    # of an hour here. The ceiling is generous so that a cold cache -- which
    # has to measure the tables and train the retargeting network before the
    # first test runs -- cannot turn a slow run into a red one.
    timeout-minutes: 90
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system graphics libraries
        # EGL and OSMesa are MuJoCo's headless rendering paths. libGLESv2 is
        # MediaPipe's: its Linux wheel links against it, and without the package
        # every import of the hand tracker dies with "libGLESv2.so.2: cannot
        # open shared object file", which reads as a broken test rather than a
        # missing library. The name changed between Ubuntu releases, so try both.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libosmesa6
          sudo apt-get install -y libgles2 || sudo apt-get install -y libgles2-mesa

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Fetch tracker model
        run: ./scripts/fetch_models.sh

      # The measured tables -- the reach table and the two gripper
      # calibrations -- are committed: they are measurements of the models, and
      # the repository is where a measurement belongs. The retargeting network
      # is not: it is trained, from a fixed seed, and it is the one generated
      # asset a fresh checkout does not have. So there is exactly one cache,
      # keyed on the code and the model that determine it.
      #
      # Restore and save are separate steps on purpose: `actions/cache` skips
      # saving when the job fails, so one red test run would make every later
      # run retrain from scratch -- exactly when a ten-minute build is least
      # welcome. Saving before the suite runs means a failing test costs the
      # next run nothing, while a failing build still saves nothing.
      - name: Restore the retargeting network
        id: retargeter
        uses: actions/cache/restore@v4
        with:
          path: assets/cache/leap_retargeter.pt
          key: >-
            retargeter-${{ hashFiles('src/handrobot/dexhand/**',
            'assets/leap/**') }}

      - name: Build whatever the caches did not have
        # Explicit, so a cold cache shows up as a named step that took ten
        # minutes rather than as a test that mysteriously did.
        run: .venv/bin/python -m handrobot warmup

      - name: Save the retargeting network
        if: steps.retargeter.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/cache/leap_retargeter.pt
          key: ${{ steps.retargeter.outputs.cache-primary-key }}

      - name: Test
        run: .venv/bin/pytest -q --durations=15
