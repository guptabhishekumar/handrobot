name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system OpenGL for headless MuJoCo rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libosmesa6
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Fetch tracker model
        run: ./scripts/fetch_models.sh
      - name: Test
        run: .venv/bin/pytest -q
